spring:
  config:
    import:
      - classpath:panel.yml
      - optional:file:${PANEL_CONFIG_FILE_PATH:}
  application:
    admin:
      enabled: true
    name: panel-api
    group: mrpanel
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: "classpath:db/migration"
  modulith:
    events:
      # table events.event_publication is created by Flyway (V0.0.26.00), not by Modulith at startup
      jdbc:
        schema-initialization:
          enabled: false
        schema: "events"
      completion-mode: update
      republish-outstanding-events-on-restart: true
      staleness:
        processing: 1h
        published: 2h
        resubmission: 1h
        # the key is spelled "check-intervall" in spring-modulith-events-core 2.0.1 metadata; "check-interval" is not a property
        check-intervall: 15m
panel:
  modulith:
    events:
      completed-retention-days: 30
      alarm-attempts: 5
server:
  port: 8080
  shutdown: graceful
  http2:
    enabled: true
  ssl:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  server:
    port: 9080
  metrics:
    tags:
      system: mrpanel
      service: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: true
  tracing:
    export:
      enabled: true
      otlp:
        enabled: true
    sampling:
      probability: 1
    baggage:
      enabled: true
      correlation:
        enabled: true
