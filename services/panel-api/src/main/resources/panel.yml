panel:
  db:
    url: ${JDBC_URL}
    user: ${JDBC_USER}
    password: ${JDBC_PASSWORD}
    pool:
      min-size: 1
      max-size: 8
      idleTimeout: 30s
      keep-alive: 30s
      connection-timeout: 8s
      query-test: "SELECT 1"
  directory:
    mock:
      enabled: true
      state-file: classpath:directory/mock-state.json
  entra:
    client-certificate: ${PANEL_ENTRA_CLIENT_CERTIFICATE:}
    client-certificate-key: ${PANEL_ENTRA_CLIENT_CERTIFICATE_KEY:}
  mail:
    enabled: ${PANEL_MAIL_ENABLED:false}
    sender: ${PANEL_MAIL_SENDER:}
    daily-external-limit: ${PANEL_MAIL_DAILY_EXTERNAL_LIMIT:}
