panel:
  db:
    url: ${JDBC_URL}
    user: ${JDBC_USER}
    password: ${JDBC_PASSWORD}
    pool:
      min-size: 1
      max-size: 8
      idleTimeout: 30s
      keep-alive: 30s
      connection-timeout: 8s
      query-test: "SELECT 1"
  directory:
    mock:
      enabled: true
      state-file: classpath:directory/mock-state.json
  entra:
    client-certificate: ${PANEL_ENTRA_CLIENT_CERTIFICATE:}
    client-certificate-key: ${PANEL_ENTRA_CLIENT_CERTIFICATE_KEY:}
  api:
    recruitment:
      declaration:
        # the candidate link is <web-url>/rekrutacja/deklaracja/<token>
        web-url: ${PANEL_WEB_URL:http://localhost:3000}
        # signed declarations and scans (personal data): a persistent volume in deployments
        storage-dir: ${PANEL_DECLARATIONS_DIR:./data/declarations}
      intake:
        # the public "I want to join" form; keep off until the privacy notice is approved
        enabled: ${PANEL_RECRUITMENT_INTAKE_ENABLED:false}
  mail:
    enabled: ${PANEL_MAIL_ENABLED:false}
    sender: ${PANEL_MAIL_SENDER:}
    daily-external-limit: ${PANEL_MAIL_DAILY_EXTERNAL_LIMIT:}
  fees:
    bank-account: ${PANEL_FEES_BANK_ACCOUNT:}
    # empty keeps the defaults of FeesProperties
    recipient-name: ${PANEL_FEES_RECIPIENT_NAME:}
    title-template: ${PANEL_FEES_TITLE_TEMPLATE:}
  dev:
    # Test-only shift of the single application clock (decision D8): the recruitment harness
    # advances "today" past statutory windows. Refuses to start without the 'dev' profile.
    clock-offset-days: ${PANEL_DEV_CLOCK_OFFSET_DAYS:0}
