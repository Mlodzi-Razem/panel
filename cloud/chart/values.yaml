panel:
  k8s:
    prometheus:
      release: kube-prometheus-stack #make sure that it matches the release name used during installation
      # PodMonitors require the monitoring.coreos.com CRDs (kube-prometheus-stack
      # or the prometheus-operator-crd bundle). On clusters without them — e.g. a
      # plain MicroK8s — turn this off; the services then run without scrape objects.
      podMonitors:
        enabled: true
  # ----------------------------------
  # version: 1.35.0
  # ----------------------------------
  jaeger:
    enabled: true
    image: jaegertracing/jaeger:2.13.0
    mode: deployment
    gateway:
      enabled: true
      port: 8081
  postgres:
    cnpg:
      install: true
      volumes:
        data:
          storageLimitGigabytes: 10
          cnpgPvcTemplate:
            volumeName: mrpanel-postgres-pv
            storageClassName: manual
      resources:
        requestedCpuCores: 2
        maximumMemoryMb: 2048
      users:
        mrpanel:
          username: mrpanel
          password: TEST_PASSWORD
        superuser:
          username: superuser
          password: TEST_SUPERUSER_PASSWORD

  # ----------------------------------
  # jdbcUrl: jdbc:postgresql://postgres.mrpanel-database.svc.cluster.local:5432/mrpanel
  # ----------------------------------
  api:
    affinity: { }
    replicaResources:
      maximumMemoryMb: 2048
      requestedCpuCores: 2
    image: ghcr.io/mlodzi-razem/panel-api:0.0.0-MRPANEL-SNAPSHOT
    # Name of a pre-created docker-registry Secret (dockerconfigjson) for
    # pulling private images; unset = no imagePullSecrets.
    imagePullSecret: ''
    service:
      type: ClusterIP
    hpa:
      enabled: false #multiple replicas are not supported at the moment because of the lack of external cache support
    cache:
      externalized: false #cache externalization is not supported at the moment
    networkPolicy:
      enabled: true
      monitoringNamespace: monitoring #namespace from which the management port (9080) may be scraped
    config:
      #-- application.yaml format. Can be string or map. --
      # See `services/panel-api/src/main/resources/panel.yaml` for reference
      panel: {}
      #------------------------------
  web:
    url: https://panel.mlodzirazem.org
    auth:
      google:
        clientId: '{{ fail "Missing panel.web.auth.google.clientId" }}'
        clientSecret: '{{ fail "Missing panel.web.auth.google.clientSecret" }}'
        workspaceDomain: '{{ fail "Missing panel.web.auth.google.workspaceDomain" }}'
    affinity: { }
    replicaResources:
      maximumMemoryMb: 768
      requestedCpuCores: 0.5
    image: ghcr.io/mlodzi-razem/panel-web:0.0.0-MRPANEL-SNAPSHOT
    # Name of a pre-created docker-registry Secret (dockerconfigjson) for
    # pulling private images; unset = no imagePullSecrets.
    imagePullSecret: ''
    service:
      type: ClusterIP
    hpa:
      enabled: true
      targetCpuPercentage: 75
      targetMemoryPercentage: 75
      minReplicas: 2
      maxReplicas: 4
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 5
    # ----------------------------------
    # hpa:
    #   enabled: false
    # replicas: 2
    # ----------------------------------
    rollingUpdates:
      enabled: true #requires `replicas` or `minReplicas` > 1
      maxSurge: 1
      maxUnavailable: 1
    # ----------------------------------
    # rollingUpdates:
    #   enabled: false
    # ----------------------------------
  gateway:
    install: true
    # ----------------------------------
    # install: false
    # ----------------------------------
    gatewayClass: istio
    domains:
      - panel.mlodzirazem.org
    tls:
      # Which issuer provisions panel-ssl-cert. "origin-ca" keeps the Cloudflare
      # Origin CA flow this chart was built with (origin-ca-issuer controller +
      # an API token; the zone is proxy=orange in Cloudflare). "letsencrypt"
      # switches to a cert-manager ACME ClusterIssuer whose HTTP-01 challenge is
      # solved through the extra port-80 listener on the panel Gateway — use it
      # when the domain resolves straight to this cluster without Cloudflare's
      # proxy; it needs cert-manager >= 1.16 with Gateway API support enabled.
      issuer: origin-ca
      # ACME account e-mail for the Lets Encrypt issuer (required when issuer
      # is "letsencrypt"; a public value, not a secret).
      acmeEmail: ''

  #For autocompletion and linting purposes only. Define your secrets in a separate file.
  secrets:
    panel:
      web:
        metricsToken: '{{ fail "Missing panel.secrets.panel.web.metricsToken" }}'
        nextauthToken: '{{ fail "Missing panel.secrets.panel.web.nextauthToken" }}'
      apiAuthSecret: '{{ fail "Missing panel.secrets.panel.apiAuthSecret" }}' #at least 32 bytes, e.g. `openssl rand -base64 48`
    postgres:
      database: '{{ fail "Missing panel.secrets.postgres.database" }}'
      admin:
        username: '{{ fail "Missing panel.secrets.postgres.admin.username" }}'
        password: '{{ fail "Missing panel.secrets.postgres.admin.password" }}'
      panel:
        username: '{{ fail "Missing panel.secrets.postgres.panel.username" }}'
        password: '{{ fail "Missing panel.secrets.postgres.panel.password" }}'
    google:
      oauth:
        clientId: '{{ fail "Missing panel.secrets.google.oauth.clientId" }}'
        clientSecret: '{{ fail "Missing panel.secrets.google.oauth.clientSecret" }}'
      workspace:
        accountToken: '{{ fail "Missing panel.secrets.google.workspace.accountToken" }}'
    smtp:
      host: '{{ fail "Missing panel.secrets.smtp.host" }}'
      port: 587
      username: '{{ fail "Missing panel.secrets.smtp.username" }}'
      password: '{{ fail "Missing panel.secrets.smtp.password" }}'
    cloudflare:
      apiKey: '{{ fail "Missing panel.secrets.cloudflare.apiKey" }}'
    # The Panel MR app registration in Microsoft Entra. Leave empty to disable Microsoft 365 sign-in and the Teams app;
    # the tenant and client IDs alone enable the Teams app, the secret also enables sign-in in the browser,
    # and the certificate with its key signs panel-api's Graph lookups (the tenant blocks client secrets).
    entra:
      tenantId: ''
      clientId: ''
      clientSecret: ''
      clientCertificate: ''
      clientCertificateKey: ''