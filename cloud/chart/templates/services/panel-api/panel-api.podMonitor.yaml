{{- /* PodMonitor requires the monitoring.coreos.com CRDs; the chart-wide
       panel.k8s.prometheus.podMonitors.enabled switch keeps installs working
       on clusters without the prometheus operator. */ -}}
{{- if .Values.panel.k8s.prometheus.podMonitors.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: panel-api
  namespace: {{ .Release.Namespace }}
  labels: {{ include "panel-api.labels" . | nindent 4 }}
spec:
  podMetricsEndpoints:
    - portNumber: 9080
      interval: 60s
      scrapeTimeout: 15s
      path: /actuator/prometheus
      enableHttp2: true
  selector:
    matchLabels: {{ include "panel-api.labels" . | nindent 6 }}
{{- end }}
