{{- if not .Values.panel.api.declarations.existingClaim -}}
{{- /* Signed declarations and paper scans: personal data that exists nowhere
       else (the database keeps only the references). "keep" leaves the claim
       and its data in place on helm uninstall; a reinstall under the same
       release name and namespace adopts it again. Deleting the namespace or
       the claim is NOT covered (see deploy/stage/RUNBOOK.md §12). */ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-api-declarations
  namespace: {{ .Release.Namespace }}
  labels: {{ include "panel-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.panel.api.declarations.storageClassName }}
  storageClassName: {{ tpl . $ | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ tpl (toString .Values.panel.api.declarations.sizeGigabytes) . }}Gi
{{- end -}}
