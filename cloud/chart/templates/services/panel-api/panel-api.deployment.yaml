{{- $defaultImage := print "ghcr.io/mlodzi-razem/panel-api:" .Chart.AppVersion -}}
{{- $configMountPath := "/mnt/config" -}}
{{- $declarationsMountPath := "/var/lib/panel/declarations" -}}
{{- $cnpgEnabled := dig "cnpg" "install" false .Values.panel.postgres -}}
{{- $jdbcUrl := (ternary
  (print "jdbc:postgresql://cnpg-rw." .Release.Namespace ".svc.cluster.local:5432/mrpanel")
  (tpl (.Values.panel.postgres.jdbcUrl | default "") .)
  $cnpgEnabled
)  -}}
{{- $postgresSecret := ternary "cnpg-user-secret" "panel-api-postgres-credentials" $cnpgEnabled -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-api
  namespace: {{ .Release.Namespace }}
  labels: {{ include "panel-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{ include "panel-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "panel-api.labels" . | nindent 8 }}
      namespace: {{ .Release.Namespace }}
      name: panel-api
      annotations:
        instrumentation.opentelemetry.io/inject-java: "panel-otel-instrumentation"
    spec:
      {{- /* Optional pre-created docker-registry Secret for private images. */ -}}
      {{- with .Values.panel.api.imagePullSecret }}
      imagePullSecrets:
        - name: {{ tpl . $ | quote }}
      {{- end }}
      volumes:
        - name: config
          secret:
            secretName: panel-api-config
            optional: false
            defaultMode: 0444
        - name: declarations
          persistentVolumeClaim:
            claimName: {{ tpl (.Values.panel.api.declarations.existingClaim | default "panel-api-declarations") . }}
      hostname: {{ .Release.Namespace }}-panel-api
      initContainers:
        # Hands the volume to the API user and closes it to everyone else. Needed because kubelet's fsGroup
        # does not apply to hostPath-backed classes (microk8s-hostpath). The only root container of the pod.
        - name: declarations-permissions
          image: {{ tpl (.Values.panel.api.image | default $defaultImage) . }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "chown 10001:10001 {{ $declarationsMountPath }} && chmod 700 {{ $declarationsMountPath }}"]
          volumeMounts:
            - mountPath: {{ $declarationsMountPath }}
              name: declarations
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
      containers:
        - name: panel-api
          ports:
            - containerPort: 8080
              name: api
              protocol: TCP
            - containerPort: 9080
              name: metrics
              protocol: TCP
          image: {{ tpl (.Values.panel.api.image | default $defaultImage) . }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: {{ $configMountPath }}
              name: config
              readOnly: true
            - mountPath: {{ $declarationsMountPath }}
              name: declarations
          resources:
            limits:
              memory: {{ tpl (toString .Values.panel.api.replicaResources.maximumMemoryMb) . }}Mi
            requests:
              cpu: {{ tpl (toString .Values.panel.api.replicaResources.requestedCpuCores) . }}
          env:
            - name: JDBC_URL
              value: {{ $jdbcUrl | quote }}
            - name: JDBC_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ $postgresSecret }}
                  optional: false
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ $postgresSecret }}
                  optional: false
            # e-declaration: files go to the persistent volume, the candidate link to the public web address
            - name: PANEL_DECLARATIONS_DIR
              value: {{ $declarationsMountPath }}
            - name: PANEL_WEB_URL
              value: {{ tpl .Values.panel.web.url . | quote }}
            # use the configuration file defined in panel.api.config
            - name: PANEL_CONFIG_FILE_PATH
              value: {{ $configMountPath }}/panel-pod-config.yaml
            - name: PANEL_API_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: auth-secret
                  name: panel-api-auth
                  optional: false
            {{- range $env, $key := dict "PANEL_ENTRA_TENANT_ID" "entra-tenant-id" "PANEL_ENTRA_CLIENT_ID" "entra-client-id" "PANEL_ENTRA_CLIENT_SECRET" "entra-client-secret" "PANEL_ENTRA_CLIENT_CERTIFICATE" "entra-client-certificate" "PANEL_ENTRA_CLIENT_CERTIFICATE_KEY" "entra-client-certificate-key" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  key: {{ $key }}
                  name: panel-api-auth
                  optional: true
            {{- end }}
            {{- with .Values.panel.mail }}
            # transactional mail (M5): off unless panel.mail.enabled; the sender must be in the association's own domain
            - name: PANEL_MAIL_ENABLED
              value: {{ .enabled | default false | quote }}
            {{- if .sender }}
            - name: PANEL_MAIL_SENDER
              value: {{ .sender | quote }}
            {{- end }}
            {{- if .dailyExternalLimit }}
            - name: PANEL_MAIL_DAILY_EXTERNAL_LIMIT
              value: {{ .dailyExternalLimit | toString | quote }}
            {{- end }}
            {{- end }}
            - name: management.observations.key-values.environment
              value: {{ .Release.Namespace }}
            - name: management.observations.key-values.version
              value: {{ .Chart.AppVersion }}
            # enable JSON logging
            - name: logging.structured.format.console
              value: "ecs"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9080
          securityContext:
            allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
