apiVersion: v1
kind: Secret
metadata:
  name: panel-api-auth
  namespace: {{ .Release.Namespace }}
  labels: {{ include "panel-api.labels" . | nindent 4 }}
data:
  auth-secret: {{ tpl .Values.panel.secrets.panel.apiAuthSecret . | b64enc | quote }}
  {{- with .Values.panel.secrets.entra }}
  entra-tenant-id: {{ tpl (.tenantId | default "") $ | b64enc | quote }}
  entra-client-id: {{ tpl (.clientId | default "") $ | b64enc | quote }}
  entra-client-secret: {{ tpl (.clientSecret | default "") $ | b64enc | quote }}
  entra-client-certificate: {{ tpl (.clientCertificate | default "") $ | b64enc | quote }}
  entra-client-certificate-key: {{ tpl (.clientCertificateKey | default "") $ | b64enc | quote }}
  {{- end }}
