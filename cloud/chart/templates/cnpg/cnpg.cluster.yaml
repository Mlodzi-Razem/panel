{{- if .Values.panel.postgres.cnpg.install -}}

{{- $pvcTemplate := (ternary
  (tpl (toYaml (.Values.panel.postgres.cnpg.volumes.data.cnpgPvcTemplate) | default "") .)
  (tpl (toYaml .Values.panel.postgres.cnpg.volumes.data.cnpgPvcTemplate) .)
  (kindIs "string" .Values.panel.postgres.cnpg.volumes.data.cnpgPvcTemplate)
) -}}

{{- /* Database created at bootstrap: the same value the api datasource
       uses. panel.secrets.postgres.database is owner-supplied via the
       secrets values file; the chart default is a tpl fail-guard (see
       values.yaml), so evaluate it with tpl like the api config secret
       does. "mrpanel" matches the managed role in .Values.panel.postgres.cnpg
       and keeps `helm template` working with the example secrets file. */ -}}
{{- $pgDatabase := (tpl (toString (dig "postgres" "database" "" .Values.panel.secrets)) .) | default "mrpanel" -}}
{{- $pgInitSql := .Values.panel.postgres.cnpg.postInitApplicationSQL -}}

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg
  namespace: {{ .Release.Namespace }}
spec:
  instances: 1
  storage:
    size: {{ tpl (toString .Values.panel.postgres.cnpg.volumes.data.storageLimitGigabytes) . }}Gi
    pvcTemplate: {{ $pvcTemplate | nindent 6 }}
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  imagePullPolicy: IfNotPresent
  superuserSecret:
    name: cnpg-admin-secret
  bootstrap:
    initdb:
      database: {{ $pgDatabase | quote }}
      encoding: UTF8
      dataChecksums: true
      locale: en_US.UTF-8
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
  managed:
    roles:
      - name: mrpanel
        ensure: present
        login: true
        superuser: false
        createdb: true
        passwordSecret:
          name: cnpg-user-secret
    services:
      disabledDefaultServices: ['r', 'ro'] # not needed for single-instance clusters
  postgresql:
    parameters:
      shared_buffers: {{ div (tpl (toString .Values.panel.postgres.cnpg.resources.maximumMemoryMb) .) 4 }}MB
      random_page_cost: '1.1'
      wal_level: logical

{{- end -}}