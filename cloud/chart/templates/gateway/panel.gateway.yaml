{{- /* Gateway API v1. For the letsencrypt TLS flow an extra HTTP:80 listener
       serves ACME HTTP-01 challenges (cert-manager gatewayHTTP01 solver);
       the origin-ca flow keeps the single HTTPS listener. */ -}}
{{- if .Values.panel.gateway.install -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: panel-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{ include "gateway.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ tpl .Values.panel.gateway.gatewayClass . | quote }}
  listeners:
    - name: panel-web
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: panel-ssl-cert
            namespace: {{ .Release.Namespace }}
            group: ""
    {{- if eq (default "origin-ca" (dig "tls" "issuer" "" .Values.panel.gateway)) "letsencrypt" }}
    - name: panel-acme
      port: 80
      protocol: HTTP
    {{- end }}
{{- end -}}
