{{- /* Issuer for the panel TLS certificate.
       panel.gateway.tls.issuer selects the mechanism:

       "origin-ca"  - Cloudflare Origin CA (origin-ca-issuer controller,
                      API token in panel-cloudflare-api-token). Upstream
                      default; the zone is proxied by Cloudflare.
       "letsencrypt" - cert-manager ACME ClusterIssuer; the HTTP-01 challenge
                      is solved through the extra port-80 listener that
                      panel.gateway.yaml attaches to the panel Gateway.
                      Needs cert-manager >= 1.16 with Gateway API support.
*/ -}}
{{- if and .Values.panel.gateway.install (eq (default "origin-ca" (dig "tls" "issuer" "" .Values.panel.gateway)) "origin-ca") -}}
apiVersion: cert-manager.k8s.cloudflare.com/v1
kind: OriginIssuer
metadata:
  name: panel-cert-issuer
  namespace: {{ .Release.Namespace }}
  labels: {{ include "gateway.labels" . | nindent 4 }}
spec:
  requestType: OriginECC
  auth:
    tokenRef:
      key: token
      name: panel-cloudflare-api-token
{{- end -}}
{{- if and .Values.panel.gateway.install (eq (default "origin-ca" (dig "tls" "issuer" "" .Values.panel.gateway)) "letsencrypt") -}}
{{- if not (dig "tls" "acmeEmail" "" .Values.panel.gateway) -}}
{{- fail "panel.gateway.tls.acmeEmail is required when panel.gateway.tls.issuer is letsencrypt" -}}
{{- end -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: panel-le-issuer
  labels: {{ include "gateway.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.panel.gateway.tls.acmeEmail | quote }}
    privateKeySecretRef:
      name: panel-le-acme-account-key
    solvers:
      - http01:
          gatewayHTTP01:
            gatewayRef:
              name: panel-gateway
              namespace: {{ .Release.Namespace }}
            # cert-manager matches the protocol listener on the named Gateway;
            # panel.gateway.yaml attaches an HTTP:80 listener when tls.issuer
            # is letsencrypt.
            port: 80
{{- end -}}
