{{- if .Values.panel.gateway.install -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: panel-web-httproute
  namespace: {{ .Release.Namespace }}
  labels: {{ include "gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: panel-gateway
      namespace: {{ .Release.Namespace }}
      sectionName: panel-web
  hostnames: {{ tpl (.Values.panel.gateway.domains | toJson) . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: panel-web
          port: 3000
          group: ""
          kind: Service
          namespace: {{ .Release.Namespace }}
{{- end -}}