# values.stage-secrets.example.yaml — szablon sekretów STAGE dla wariantu K (microk8s).
#
# Właściciel kopiuje ten plik na VPS jako `values.stage-secrets.yaml`
# (np. ~/panel-stage/microk8s/values.stage-secrets.yaml) i podstawia
# WŁASNE wartości. Plik nigdy nie trafia do repo z prawdziwymi wartościami;
# nigdy nie wklejaj ich do czatu. Wzorce generowania — RUNBOOK §2.
# Helm przeszanie: helm -f values.stage-microk8s.yaml -f values.stage-secrets.yaml
#
# Uwaga do gałęzi "origin-ca": jeśli w values.stage-microk8s.yaml wybrano
# issuer=letsencrypt, sekcja cloudflare.apiKey nie jest renderowana — może
# zostać pusta. Workspace token Google (secrets.google.workspace.accountToken)
# i smtp NIE są używane przez szablony chartu — zostawione dla kompletności
# struktury, można też pominąć.

panel:
  web:
    auth:
      google:
        # Wymagane przez deployment panel-web (renderuje env). Na stage
        # celowo placeholder — przycisk Google nie działa (RUNBOOK §9.6).
        clientId: stage-signin-disabled.example
        clientSecret: stage-signin-disabled.example
        workspaceDomain: mlodzirazem.org

  postgres:
    cnpg:
      users:
        superuser:
          username: superuser
          # WARTOŚĆ WKŁADA WŁAŚCICIEL: openssl rand -base64 24
          password: stage-postgres-admin-placeholder
        mrpanel:
          username: mrpanel
          # WARTOŚĆ WKŁADA WŁAŚCICIEL: openssl rand -base64 24 (baza stage)
          password: stage-postgres-panel-placeholder

  # Secrets containerów (panel.secrets.*) — te same wartości co w .env.stage
  # ścieżki compose (RUNBOOK §2), żeby oba tory miały spójne sekrety.
  secrets:
    postgres:
      # Nazwa bazy tworzonej przez CNPG przy bootstrap (chart: cnpg.cluster
      # initdb). Musi się zgadzać z URL datasource w panel.api.config.
      # Pula wartości = nazwa roli zarządzanej (panel.postgres.cnpg.users).
      database: mrpanel
    panel:
      web:
        # WARTOŚĆ WKŁADA WŁAŚCICIEL: openssl rand -base64 24
        metricsToken: stage-metrics-placeholder
        # WARTOŚĆ WKŁADA WŁAŚCICIEL: openssl rand -base64 32
        nextauthToken: stage-nextauth-placeholder
      # Wspólny sekret tokenów serwisowych (≥32 bajty) — panel-api i panel-web
      # muszą mieć tę samą wartość.
      # WARTOŚĆ WKŁADA WŁAŚCICIEL: openssl rand -base64 48
      apiAuthSecret: stage-placeholder-secret-0123456789-abcdefghijklmnop
    google:
      oauth:
        clientId: stage-signin-disabled.example
        clientSecret: stage-signin-disabled.example
      workspace:
        accountToken: ''   # nieużywane przez szablony; zostaw puste
    # Microsoft Entra — aplikacja „Panel MR” (logowanie M365 + Teams SSO + odczyt Graph).
    # Puste = logowanie Microsoft wyłączone. Redirect URI w Entra:
    #   https://dev.panel.mlodzirazem.org/api/auth/callback/azure-ad
    entra:
      tenantId: 9e97a4dc-d20d-453b-a3ae-eadfc4c7844b
      clientId: 6b106e9e-8d52-48a3-b09e-52985110f6c6
      # Logowanie w PRZEGLĄDARCE (panel-web, next-auth) wymaga client secretu.
      # WARTOŚĆ WKŁADA WŁAŚCICIEL: Entra → Panel MR → Certyfikaty i wpisy tajne →
      # Nowy wpis tajny (krótki termin, np. 6 mies.) — tylko tutaj, nigdy w repo.
      clientSecret: ''
      # Odczyt Graph przez panel-api (employeeId, wysyłka poczty) — certyfikat
      # zamiast sekretu; PEM certyfikatu i klucza PKCS#8. Gdy jest komplet,
      # ma pierwszeństwo przed clientSecret po stronie API.
      clientCertificate: ''
      clientCertificateKey: ''
    smtp:
      host: ''            # nieużywane przez szablony; zostaw puste
      port: 587
      username: ''
      password: ''
    cloudflare:
      # Wymagane TYLKO dla tls.issuer=origin-ca (patrz values.stage-microk8s.yaml).
      # WARTOŚĆ WKŁADA WŁAŚCICIEL: token Cloudflare (Origin CA) — albo zostaw
      # puste przy letsencrypt.
      apiKey: ''
    # Entra (SSO) — na start PUSTE;_RUNBOOK §9. Po włączeniu: tenantId/clientId
    # są publiczne; secret/certyfikaty idą przez panel.api.config (plik YAML
    # montowany do panel-api), nie przez te wartości.
    entra:
      tenantId: ''
      clientId: ''
      clientSecret: ''
      clientCertificate: ''
      clientCertificateKey: ''
